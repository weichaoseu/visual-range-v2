<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>测角测距 · 测量端（相机）</title>
<style>
  :root{ --bg:#0f1420; --panel:#1a2233; --line:#2a3448; --txt:#e6edf7; --dim:#8a97ad; --acc:#3fb6ff; --ok:#3fd68f; --warn:#ffb454; }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--txt); display:flex; flex-direction:column; }
  #videoWrap{ flex:1; position:relative; background:#000; overflow:hidden; }
  #video{ width:100%; height:100%; object-fit:cover; }
  #crosshair{ position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); color:#0ff; font-size:34px; font-weight:700; text-shadow:0 0 4px rgba(0,0,0,.9); pointer-events:none; }
  #dist{ position:absolute; top:14px; left:0; right:0; text-align:center; font-size:32px; font-weight:700; color:#fff; text-shadow:0 1px 5px rgba(0,0,0,.9); font-variant-numeric:tabular-nums; }
  #panel{ padding:12px 16px; background:var(--panel); border-top:1px solid var(--line); }
  .row{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:8px; }
  label{ font-size:14px; color:var(--dim); }
  input[type=number]{ width:84px; background:#0c1220; border:1px solid var(--line); color:var(--txt); border-radius:6px; padding:8px 9px; font-size:14px; }
  button{ background:var(--acc); color:#04121f; border:none; border-radius:8px; padding:10px 14px; font-size:13.5px; font-weight:600; cursor:pointer; }
  button.sec{ background:#2a3448; color:var(--txt); }
  button.done{ background:var(--ok); }
  #status{ font-size:12.5px; color:var(--dim); min-height:18px; margin-bottom:4px; }
  #hint{ font-size:12px; color:var(--dim); line-height:1.6; }
</style>
</head>
<body>
  <div id="videoWrap">
    <video id="video" autoplay playsinline muted></video>
    <div id="crosshair">+</div>
    <div id="dist">距离：---</div>
  </div>
  <div id="panel">
    <div class="row">
      <label>目标屏宽(mm)</label>
      <input type="number" id="mmInput" value="70" min="20" max="200" step="1">
      <button id="calibBtn">校准焦距(1米)</button>
      <button id="switchBtn" class="sec">切换摄像头</button>
    </div>
    <div class="row">
      <label>基线(mm)</label>
      <input type="number" id="baseInput" value="150" min="30" max="1000" step="10">
      <button id="rec1Btn">记录位置1</button>
      <button id="rec2Btn">记录位置2</button>
      <button id="resetBtn" class="sec">重置</button>
    </div>
    <div id="status">点击视频区域启动相机…</div>
    <div id="hint">
      1. 另一台手机打开 <b>marker.html</b>（品红方块），放在待测位置<br>
      2. 先用「校准焦距」：把标记放到正好 <b>1 米</b>处，填目标屏宽(mm)，点校准<br>
      3. 对准标记（十字对准），点「<b>记录位置1</b>」<br>
      4. 手机<b>横向平移</b>一个已知距离（基线，默认 150mm），再对准标记，点「<b>记录位置2</b>」<br>
      5. 自动三角算出距离
    </div>
  </div>
  <canvas id="canvas" style="display:none"></canvas>
  <script>
  "use strict";
  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  const mmInput = document.getElementById('mmInput');
  const baseInput = document.getElementById('baseInput');
  const calibBtn = document.getElementById('calibBtn');
  const rec1Btn = document.getElementById('rec1Btn');
  const rec2Btn = document.getElementById('rec2Btn');
  const resetBtn = document.getElementById('resetBtn');
  const distEl = document.getElementById('dist');
  const statusEl = document.getElementById('status');

  const CW = 640, CH = 480;
  canvas.width = CW; canvas.height = CH;

  let facing = 'environment';
  let camOn = false;
  let focalPx = null;
  let cx1 = null, cx2 = null;
  let curCx = null, curW = null, curCount = 0;

  function loadFocal(){ focalPx = parseFloat(localStorage.getItem('ang_focal_' + facing)) || null; }
  function saveFocal(){ if (focalPx) localStorage.setItem('ang_focal_' + facing, focalPx); }
  loadFocal();

  async function startCam(mode){
    if (mode && mode !== facing){
      facing = mode;
      loadFocal();
    }
    if (video.srcObject){ video.srcObject.getTracks().forEach(t => t.stop()); video.srcObject = null; }
    camOn = false;
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facing } });
      video.srcObject = stream;
      await video.play();
      camOn = true;
      statusEl.textContent = (facing==='environment'?'后置':'前置') + '摄像头已启动' + (focalPx ? '（已校准）' : '（需校准焦距）');
    } catch(e){
      statusEl.textContent = '相机启动失败：' + e.message + '（需 HTTPS，点击视频区域重试）';
    }
  }

  function loop(){
    if (camOn && video.readyState >= 2){
      ctx.drawImage(video, 0, 0, CW, CH);
      const img = ctx.getImageData(0, 0, CW, CH);
      const d = img.data;
      let sumX=0, sumY=0, count=0, minX=CW, maxX=-1, minY=CH, maxY=-1;
      for (let i=0; i<d.length; i+=4){
        const r=d[i], g=d[i+1], b=d[i+2];
        if (r>60 && b>60 && g < (r+b)*0.3){
          const x=(i>>2)%CW, y=(i>>2)/CW|0;
          sumX+=x; sumY+=y; count++;
          if (x<minX) minX=x; if (x>maxX) maxX=x;
          if (y<minY) minY=y; if (y>maxY) maxY=y;
        }
      }
      if (count > 300 && (maxX-minX) > 10){
        curCx = sumX / count;         // 质心 x
        curW = maxX - minX;           // 宽度（用于校准焦距）
        curCount = count;
        const offsetPx = curCx - CW/2;
        if (cx1 === null && cx2 === null){
          distEl.textContent = '标记偏移 ' + (offsetPx>0?'+':'') + offsetPx.toFixed(1) + ' px';
        }
      } else {
        curCx = null; curW = null; curCount = 0;
        distEl.textContent = '未检测到标记';
      }
    }
    requestAnimationFrame(loop);
  }

  calibBtn.addEventListener('click', () => {
    if (!curW){ statusEl.textContent = '请先把相机对准品红方块（1 米处）'; return; }
    const mm = parseFloat(mmInput.value);
    if (!mm || mm <= 0){ statusEl.textContent = '请先填目标屏宽(mm)'; return; }
    focalPx = curW * 1000 / mm;
    saveFocal();
    statusEl.textContent = '焦距校准完成 ✓ ' + focalPx.toFixed(1) + ' px';
  });

  rec1Btn.addEventListener('click', () => {
    if (!focalPx){ statusEl.textContent = '请先校准焦距'; return; }
    if (curCx === null){ statusEl.textContent = '未检测到标记，请对准品红方块'; return; }
    cx1 = curCx;
    rec1Btn.classList.add('done');
    statusEl.textContent = '位置1已记录（偏移 ' + (cx1-CW/2).toFixed(1) + ' px）。平移手机后记录位置2';
    distEl.textContent = '位置1 ✓';
  });

  rec2Btn.addEventListener('click', () => {
    if (cx1 === null){ statusEl.textContent = '请先记录位置1'; return; }
    if (curCx === null){ statusEl.textContent = '未检测到标记，请对准品红方块'; return; }
    cx2 = curCx;
    const baseMm = parseFloat(baseInput.value);
    const dx = Math.abs(cx1 - cx2);
    if (!baseMm || baseMm <= 0){ statusEl.textContent = '请填基线(mm)'; return; }
    if (dx < 2){ statusEl.textContent = '两次位置像素差太小（' + dx.toFixed(1) + 'px），基线太小或目标太远'; return; }
    const distMm = baseMm * focalPx / dx;
    const distCm = distMm / 10;
    distEl.textContent = distCm < 200 ? (distCm.toFixed(1) + ' cm') : ((distCm/100).toFixed(2) + ' m');
    statusEl.textContent = '三角测距完成：位置1=' + cx1.toFixed(1) + 'px，位置2=' + cx2.toFixed(1) + 'px，位移=' + dx.toFixed(1) + 'px';
  });

  resetBtn.addEventListener('click', () => {
    cx1 = null; cx2 = null;
    rec1Btn.classList.remove('done');
    statusEl.textContent = '已重置';
    distEl.textContent = '距离：---';
  });

  document.getElementById('switchBtn').addEventListener('click', () => startCam(facing==='environment'?'user':'environment'));
  document.getElementById('videoWrap').addEventListener('click', () => { if (!camOn) startCam(); });
  startCam();
  requestAnimationFrame(loop);
  </script>
</body>
</html>
